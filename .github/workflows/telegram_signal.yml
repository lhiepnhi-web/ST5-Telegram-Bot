name: ST5 Telegram Signal

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 2-4 * * 1-5"
    - cron: "*/5 6-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: st5-telegram-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ST5 Telegram Signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python st5_telegram_bot.py

      - name: Save bot state
        run: |
          git config user.name "ST5 Bot"
          git config user.email "st5-bot@users.noreply.github.com"
          git add bot_state.json
          git diff --cached --quiet || git commit -m "ST5 bot state update"
          git push 
