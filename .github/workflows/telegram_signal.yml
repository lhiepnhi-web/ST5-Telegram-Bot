name: ST5 Telegram Signal

on:
  workflow_dispatch:

  schedule:
    # 09:15 - 11:30 Vietnam
    - cron: "*/5 9-11 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"

    # 13:00 - 14:30 Vietnam
    - cron: "*/5 13-14 * * 1-5"
      timezone: "Asia/Ho_Chi_Minh"

permissions:
  contents: write

concurrency:
  group: st5-telegram-signal
  cancel-in-progress: false

jobs:

  signal:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ST5 Telegram Signal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python st5_telegram_bot.py

      - name: Save bot state
        run: |
          if [ -f bot_state.json ]; then
            git config user.name "ST5 Bot"
            git config user.email "st5-bot@users.noreply.github.com"

            git add bot_state.json

            if git diff --cached --quiet; then
              echo "No state changes."
            else
              git commit -m "ST5 bot state update"
              git push
            fi
          else
            echo "No bot_state.json created."
            echo "This is normal when there is no state update."
          fi 
